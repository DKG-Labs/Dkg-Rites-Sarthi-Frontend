name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - erc-sleepr-prod
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - erc-sleepr-prod

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Generate Deployment Version Metadata
        id: version_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          fi
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          COMMIT_SHA="${GITHUB_SHA::7}"

          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "APP_GIT_COMMIT=$COMMIT_SHA" >> $GITHUB_ENV

          mkdir -p public
          cat <<EOF > public/version.json
          {
            "version": "$VERSION",
            "buildTime": "$BUILD_TIME",
            "gitCommit": "$COMMIT_SHA"
          }
          EOF

          echo "✅ Generated version.json with version: $VERSION, buildTime: $BUILD_TIME, commit: $COMMIT_SHA"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          REACT_APP_VERSION: ${{ env.APP_VERSION }}
          REACT_APP_BUILD_TIME: ${{ env.APP_BUILD_TIME }}
          REACT_APP_GIT_COMMIT: ${{ env.APP_GIT_COMMIT }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_APP_BUILD_TIME: ${{ env.APP_BUILD_TIME }}
          VITE_APP_GIT_COMMIT: ${{ env.APP_GIT_COMMIT }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUSHROOM_04C1FDE00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_MUSHROOM_04C1FDE00 }}
          action: "close"
